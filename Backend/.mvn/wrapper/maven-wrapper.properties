# The mvnw / mvnw.cmd scripts in this repo were committed without this
# properties file, which they require to know which Maven Wrapper jar and
# Maven distribution to download -- so `./mvnw` as previously committed
# could not actually run. This restores the standard file. It could not be
# verified end-to-end in the environment that added it (no access to
# repo.maven.apache.org there -- see README's testing section); if `./mvnw`
# still doesn't work for you, `mvn spring-boot:run` with a locally installed
# Maven 3.9+ is an equally valid fallback.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
