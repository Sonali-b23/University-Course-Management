# Every value below can be overridden by an environment variable of the
# same name (Spring's ${VAR:default} placeholder syntax) -- the literal
# values here are convenient *local development* defaults only. Never rely
# on these defaults in a shared/staging/production environment: set
# DB_USERNAME / DB_PASSWORD / DB_URL / CORS_ALLOWED_ORIGIN / JWT_SECRET /
# ADMIN_USERNAME / ADMIN_PASSWORD explicitly there instead (see README.md
# and docker-compose.yml, which does exactly this).
spring.application.name=SpringBootRestfulWs2
server.port=${SERVER_PORT:8082}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restdb}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# The frontend origin allowed to call this API (see security.SecurityConfig).
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# JWT signing secret and token lifetime (ms). The default secret below is
# NOT safe outside local development -- see security.JwtService.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-this-is-not-safe-for-production-use-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# The single default admin account created on first startup if it doesn't
# already exist -- see config.AdminSeeder. Change both, and change the
# password after first login.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
